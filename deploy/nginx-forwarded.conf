# The headers every proxied location must send, kept in one file because of
# how nginx inherits them: a location that sets ANY proxy_set_header discards
# every proxy_set_header from the level above it. All the locations here set
# Connection or Upgrade, so all of them were silently dropping Host, the real
# client IP, and the protocol — the backend saw plain http for every request,
# including the ones arriving over TLS.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
