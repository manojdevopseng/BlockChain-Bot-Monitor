# BlockChain-Bot — nginx reverse proxy
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/blockchain-bot
#   sudo ln -sf /etc/nginx/sites-available/blockchain-bot /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Both app servers listen on 127.0.0.1 only — nginx is the single public door,
# so ports 3000/8000 never need to be open in the security group.

upstream bcbot_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream bcbot_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain once DNS points here; certbot needs a real name.
    server_name _;

    # Scanner payloads and log pages can be chunky.
    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── FastAPI ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://bcbot_api;
        proxy_set_header Connection "";
        # Detection endpoints can scan a lot of documents.
        proxy_read_timeout 120s;
    }

    # ── WebSocket (realtime dashboard updates) ──────────────────────────────
    # Needs the upgrade headers and a long read timeout, otherwise nginx drops
    # the socket every 60s and the dashboard reconnect-loops.
    location /ws {
        proxy_pass http://bcbot_api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Next.js dashboard ───────────────────────────────────────────────────
    location / {
        proxy_pass http://bcbot_web;
        proxy_set_header Connection "";
        # Next.js dev-style HMR is not used in production, but keep upgrade
        # support so nothing breaks if you ever run `next dev` behind nginx.
        proxy_set_header Upgrade    $http_upgrade;
    }

    # Next.js hashed assets are immutable — let the browser keep them.
    location /_next/static/ {
        proxy_pass http://bcbot_web;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
